<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exambroser CBT Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .login-bg { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        @media print {
            body * { visibility: hidden; }
            #printableCardArea, #printableCardArea * { visibility: visible; }
            #printableCardArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <script>
        // KONFIGURASI APLIKASI
        // UBAH IS_PREVIEW KE false JIKA AKAN DI-DEPLOY KE BLOGGER
        const IS_PREVIEW = false; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxyUg5ihCOqZfqphtyEJylf9pYIxidAkdXDOGUd262Wlhofle-CHdmUIApzXuYjRFr-/exec";
    </script>

    <div id="app" class="flex-1 flex flex-col">
        <!-- Konten dinamis dirender melalui JavaScript -->
    </div>

    <script>
        // State Aplikasi
        let appState = {
            currentView: 'login', // login, student_verify, admin_dashboard, student_exam
            user: null,
            settings: {
                headerText1: "PUSPENDIK",
                headerText2: "CBT Application",
                logoUrl: "https://placehold.co/100x100/1e40af/ffffff?text=LOGO",
                kopLembaga: "PEMERINTAH KOTA SURAKARTA\nDINAS PENDIDIKAN DAN KEBUDAYAAN\nSMP NEGERI 1 SURAKARTA",
                namaKepsek: "Drs. H. Miraldi, M.Pd.",
                nipKepsek: "19681231 199403 1 012",
                ttdUrl: "https://placehold.co/150x60/000000/ffffff?text=TTD+KEPSEK",
                tahunAjaran: "2026/2027",
                semester: "Genap",
                tokenAktif: "ABCDE",
                tokenStatus: true
            },
            students: [
                { id: 1, username: "AHMAD FAUZI", password: "P1a#9x", nama: "AHMAD FAUZI", tempatLahir: "Surakarta", tanggalLahir: "2010-05-12", kelas: "9A" },
                { id: 2, username: "SITI AMINAH", password: "S2b$7y", nama: "SITI AMINAH", tempatLahir: "Boyolali", tanggalLahir: "2010-08-20", kelas: "9A" }
            ],
            classes: ["7A", "7B", "8A", "8B", "9A", "9B"],
            schedules: [
                { id: 1, hari: "Hari 1", tanggal: "2026-06-01", kelas: "9A", mapel: "Matematika", status: "Aktif" },
                { id: 2, hari: "Hari 2", tanggal: "2026-06-02", kelas: "9A", mapel: "Bahasa Indonesia", status: "Dijadwalkan" }
            ],
            questions: [
                { id: 1, kelas: "9A", mapel: "Matematika", soal: "Berapa hasil dari 5 + 5 x 2?", a: "15", b: "20", c: "10", d: "25", kunci: "a" }
            ],
            results: [
                { id: 1, nama: "AHMAD FAUZI", kelas: "9A", mapel: "Matematika", nilai: "85", waktu: "2026-06-01 09:30" }
            ]
        };

        // Token Otomatis 5 Menit
        setInterval(() => {
            if(appState.settings.tokenStatus) {
                const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
                let t = "";
                for(let i=0; i<5; i++) t += chars.charAt(Math.floor(Math.random() * chars.length));
                appState.settings.tokenAktif = t;
                if(document.getElementById('tokenDisplay')) {
                    document.getElementById('tokenDisplay').innerText = t;
                }
            }
        }, 300000);

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            if (appState.currentView === 'login') {
                app.innerHTML = renderLoginView();
            } else if (appState.currentView === 'student_verify') {
                app.innerHTML = renderStudentVerifyView();
            } else if (appState.currentView === 'admin_dashboard') {
                app.innerHTML = renderAdminDashboard();
            } else if (appState.currentView === 'student_exam') {
                app.innerHTML = renderStudentExamView();
            }
        }

        function renderLoginView() {
            return `
            <div class="login-bg flex-1 flex flex-col items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 relative">
                    <div class="flex flex-col items-center mb-6">
                        <img src="${appState.settings.logoUrl}" alt="Logo" class="w-20 h-20 object-contain mb-3" onerror="this.src='https://placehold.co/100x100/1e40af/ffffff?text=LOGO'">
                        <h1 class="text-2xl font-bold text-slate-800">${appState.settings.headerText1}</h1>
                        <p class="text-blue-600 font-semibold">${appState.settings.headerText2}</p>
                    </div>
                    
                    <div class="mb-4">
                        <h2 class="text-lg font-bold text-slate-700">Selamat Datang</h2>
                        <p class="text-xs text-slate-500">Silahkan login dengan username dan password yang anda miliki</p>
                    </div>

                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Username / NISN</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                                <input type="text" id="loginUser" required class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm uppercase" placeholder="Ketik Username...">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="loginPass" required class="w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition shadow-lg">Login</button>
                    </form>

                    <div class="mt-6 text-center text-xs text-slate-400 border-t pt-4">
                        Tahun Ajaran: ${appState.settings.tahunAjaran} | Semester: ${appState.settings.semester}
                    </div>
                </div>
            </div>`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            if (u === 'RIYANMIRALDI' && p === 'miraldi123') {
                appState.user = { role: 'admin', name: 'Riyan Miraldi' };
                appState.currentView = 'admin_dashboard';
                render();
                return;
            }

            const found = appState.students.find(s => s.username === u && s.password === p);
            if (found) {
                appState.user = { role: 'student', data: found };
                appState.currentView = 'student_verify';
                render();
                return;
            }

            alertModal("Login Gagal! Username atau password salah.");
        }

        function renderStudentVerifyView() {
            const s = appState.user.data;
            return `
            <div class="login-bg flex-1 flex flex-col items-center justify-center p-4">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8">
                    <h2 class="text-xl font-bold text-slate-800 mb-2 border-b pb-2">Konfirmasi Data & Token Ujian</h2>
                    <p class="text-xs text-slate-500 mb-6">Pastikan data diri Anda benar dan masukkan Token Aktif dari Pengawas.</p>
                    
                    <form onsubmit="handleStartExam(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                                <input type="text" id="valNama" value="${s.nama}" readonly class="w-full bg-slate-100 px-3 py-2 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                                <input type="text" id="valKelas" value="${s.kelas}" readonly class="w-full bg-slate-100 px-3 py-2 border rounded-lg text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tempat Lahir</label>
                                <input type="text" id="valTempat" value="${s.tempatLahir}" required class="w-full px-3 py-2 border rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
                                <input type="date" id="valTgl" value="${s.tanggalLahir}" required class="w-full px-3 py-2 border rounded-lg text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Token Ujian (5 Huruf)</label>
                            <input type="text" id="valToken" required class="w-full px-3 py-2 border rounded-lg text-sm uppercase font-mono tracking-widest text-center text-lg text-blue-600 font-bold" placeholder="_____">
                        </div>
                        <div class="flex space-x-3 pt-4">
                            <button type="button" onclick="appState.currentView='login'; render();" class="w-1/3 bg-slate-300 hover:bg-slate-400 text-slate-700 font-bold py-2 rounded-lg">Keluar</button>
                            <button type="submit" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg shadow">Mulai Ujian</button>
                        </div>
                    </form>
                </div>
            </div>`;
        }

        function handleStartExam(e) {
            e.preventDefault();
            const tok = document.getElementById('valToken').value.trim().toUpperCase();
            if(!appState.settings.tokenStatus) {
                alertModal("Token ujian sedang dinonaktifkan oleh Administrator!");
                return;
            }
            if(tok !== appState.settings.tokenAktif) {
                alertModal("Token Ujian Salah atau Expired!");
                return;
            }
            appState.currentView = 'student_exam';
            render();
        }

        function renderStudentExamView() {
            const user = appState.user.data;
            const soalList = appState.questions.filter(q => q.kelas === user.kelas);
            return `
            <div class="flex flex-col h-screen bg-slate-100">
                <header class="bg-blue-900 text-white px-6 py-3 flex justify-between items-center shadow">
                    <div class="flex items-center space-x-3">
                        <img src="${appState.settings.logoUrl}" class="w-8 h-8 object-contain">
                        <span class="font-bold text-lg">${appState.settings.headerText2} - Ujian Online</span>
                    </div>
                    <div class="text-sm font-semibold">Peserta: ${user.nama} (${user.kelas})</div>
                </header>
                <div class="flex-1 p-6 overflow-y-auto max-w-4xl mx-auto w-full">
                    <div class="bg-white rounded-xl shadow p-6 mb-4">
                        <h3 class="font-bold text-blue-800 mb-2">Soal No. 1</h3>
                        <p class="text-slate-700 mb-4">${soalList.length > 0 ? soalList[0].soal : 'Belum ada soal untuk kelas ini.'}</p>
                        ${soalList.length > 0 ? `
                        <div class="space-y-2">
                            <label class="flex items-center space-x-3 p-2 border rounded hover:bg-slate-50 cursor-pointer"><input type="radio" name="ans1" value="a"> <span>A. ${soalList[0].a}</span></label>
                            <label class="flex items-center space-x-3 p-2 border rounded hover:bg-slate-50 cursor-pointer"><input type="radio" name="ans1" value="b"> <span>B. ${soalList[0].b}</span></label>
                            <label class="flex items-center space-x-3 p-2 border rounded hover:bg-slate-50 cursor-pointer"><input type="radio" name="ans1" value="c"> <span>C. ${soalList[0].c}</span></label>
                            <label class="flex items-center space-x-3 p-2 border rounded hover:bg-slate-50 cursor-pointer"><input type="radio" name="ans1" value="d"> <span>D. ${soalList[0].d}</span></label>
                        </div>` : ''}
                    </div>
                    <button onclick="submitExam()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg shadow">Selesaikan & Kirim Jawaban</button>
                </div>
            </div>`;
        }

        function submitExam() {
            alertModal("Ujian berhasil diserahkan!");
            appState.currentView = 'login';
            appState.user = null;
            render();
        }

        let adminTab = 'siswa';
        function renderAdminDashboard() {
            return `
            <div class="flex h-screen bg-slate-100 overflow-hidden">
                <!-- Sidebar -->
                <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
                    <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                        <img src="${appState.settings.logoUrl}" class="w-8 h-8 object-contain">
                        <span class="font-bold text-white text-lg">CBT ADMIN</span>
                    </div>
                    <nav class="flex-1 p-4 space-y-1 overflow-y-auto text-sm">
                        <button onclick="adminTab='siswa'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='siswa'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-users mr-2"></i> Data Siswa</button>
                        <button onclick="adminTab='kelas'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='kelas'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-school mr-2"></i> Kelas</button>
                        <button onclick="adminTab='soal'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='soal'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-book mr-2"></i> Bank Soal</button>
                        <button onclick="adminTab='jadwal'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='jadwal'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-calendar mr-2"></i> Jadwal Ujian</button>
                        <button onclick="adminTab='token'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='token'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-key mr-2"></i> Token Ujian</button>
                        <button onclick="adminTab='kartu'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='kartu'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-id-card mr-2"></i> Cetak Kartu Peserta</button>
                        <button onclick="adminTab='hasil'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='hasil'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-chart-bar mr-2"></i> Hasil Jawaban</button>
                        <button onclick="adminTab='pengaturan'; render();" class="w-full text-left px-4 py-2.5 rounded-lg ${adminTab==='pengaturan'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="fa-solid fa-gear mr-2"></i> Pengaturan</button>
                    </nav>
                    <div class="p-4 border-t border-slate-800">
                        <button onclick="appState.currentView='login'; render();" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</button>
                    </div>
                </aside>
                
                <!-- Main Content -->
                <main class="flex-1 flex flex-col overflow-y-auto">
                    <header class="bg-white shadow px-8 py-4 flex justify-between items-center">
                        <h2 class="text-xl font-bold text-slate-800 capitalize">Manajemen ${adminTab}</h2>
                        <div class="text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-semibold">T.A: ${appState.settings.tahunAjaran} (${appState.settings.semester})</div>
                    </header>
                    <div class="p-8">
                        ${renderAdminTabContent()}
                    </div>
                </main>
            </div>`;
        }

        function renderAdminTabContent() {
            if (adminTab === 'siswa') {
                return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
                        <div class="space-x-2">
                            <button onclick="openAddStudentModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-plus mr-1"></i> Tambah Siswa</button>
                            <button onclick="alertModal('Template CSV Import Siswa diunduh.')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-download mr-1"></i> Template Import</button>
                            <button onclick="alertModal('Data siswa berhasil diimport.')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-upload mr-1"></i> Import Siswa</button>
                        </div>
                        <button onclick="tarikDataNaikKelas()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-rotate mr-1"></i> Tarik Data & Naik Kelas</button>
                    </div>
                    <div class="bg-white rounded-xl shadow overflow-hidden">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-slate-600 uppercase text-xs border-b">
                                <tr>
                                    <th class="p-4">Nama Lengkap</th>
                                    <th class="p-4">Username</th>
                                    <th class="p-4">Password</th>
                                    <th class="p-4">Kelas</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${appState.students.map(s => `
                                <tr class="hover:bg-slate-50">
                                    <td class="p-4 font-semibold text-slate-800">${s.nama}</td>
                                    <td class="p-4 font-mono text-xs">${s.username}</td>
                                    <td class="p-4 font-mono text-xs">${s.password}</td>
                                    <td class="p-4">${s.kelas}</td>
                                    <td class="p-4 text-center space-x-2">
                                        <button onclick="editStudent(${s.id})" class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="deleteStudent(${s.id})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            } else if (adminTab === 'kelas') {
                return `
                <div class="bg-white rounded-xl shadow p-6 space-y-4">
                    <h3 class="font-bold text-slate-800">Daftar Kelas</h3>
                    <div class="flex space-x-2">
                        <input type="text" id="newKelasName" placeholder="Nama Kelas Baru (Cth: 8C)" class="border px-3 py-2 rounded-lg text-sm w-64">
                        <button onclick="addClass()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Tambah Kelas</button>
                    </div>
                    <div class="flex flex-wrap gap-2 pt-2">
                        ${appState.classes.map(c => `<span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-lg font-semibold text-sm border border-blue-200">${c}</span>`).join('')}
                    </div>
                </div>`;
            } else if (adminTab === 'soal') {
                return `
                <div class="bg-white rounded-xl shadow p-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">Bank Soal Ujian</h3>
                        <div class="space-x-2">
                            <button onclick="alertModal('Template soal diunduh.')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Template Import Soal</button>
                            <button onclick="alertModal('Soal diimport.')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Import Soal</button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500">Soal diatur per mapel dan per kelas agar spesifik sesuai tingkat.</p>
                </div>`;
            } else if (adminTab === 'jadwal') {
                return `
                <div class="bg-white rounded-xl shadow p-6 space-y-4">
                    <h3 class="font-bold text-slate-800">Pengaturan Jadwal Ujian Harian</h3>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b text-xs uppercase text-slate-600">
                            <tr><th class="p-3">Hari</th><th class="p-3">Tanggal</th><th class="p-3">Kelas</th><th class="p-3">Mata Pelajaran</th><th class="p-3">Status</th></tr>
                        </thead>
                        <tbody class="divide-y">
                            ${appState.schedules.map(j => `
                            <tr>
                                <td class="p-3 font-semibold">${j.hari}</td>
                                <td class="p-3">${j.tanggal}</td>
                                <td class="p-3">${j.kelas}</td>
                                <td class="p-3">${j.mapel}</td>
                                <td class="p-3"><span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded text-xs">${j.status}</span></td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            } else if (adminTab === 'token') {
                return `
                <div class="bg-white rounded-xl shadow p-6 max-w-lg space-y-4">
                    <h3 class="font-bold text-slate-800">Pengaturan Token Ujian</h3>
                    <div class="p-4 bg-blue-50 rounded-xl border border-blue-200 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-blue-600 font-semibold">Token Aktif Saat Ini (Auto-refresh 5 Menit):</p>
                            <h2 id="tokenDisplay" class="text-3xl font-mono font-bold text-blue-900 tracking-widest mt-1">${appState.settings.tokenAktif}</h2>
                        </div>
                        <button onclick="alertModal('Token diperbarui manual.')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Refresh Token</button>
                    </div>
                    <div class="flex items-center space-x-3">
                        <input type="checkbox" id="tokStat" ${appState.settings.tokenStatus ? 'checked' : ''} onchange="toggleTokenStatus(this)" class="w-4 h-4 text-blue-600">
                        <label for="tokStat" class="text-sm font-medium text-slate-700">Aktifkan Token Ujian untuk Peserta</label>
                    </div>
                </div>`;
            } else if (adminTab === 'kartu') {
                return `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">Cetak Kartu Login Peserta Ujian</h3>
                        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-print mr-1"></i> Cetak Kartu</button>
                    </div>
                    <div id="printableCardArea" class="grid grid-cols-2 gap-4">
                        ${appState.students.map(s => `
                        <div class="bg-white border-2 border-slate-300 rounded-lg p-4 shadow-sm flex flex-col justify-between text-xs">
                            <div>
                                <div class="text-center font-bold uppercase text-slate-800 border-b-2 border-slate-800 pb-2 mb-2 whitespace-pre-line">${appState.settings.kopLembaga}</div>
                                <div class="flex justify-between items-center mb-2">
                                    <img src="${appState.settings.logoUrl}" class="w-12 h-12 object-contain">
                                    <div class="text-right">
                                        <div class="font-bold text-blue-900">${appState.settings.headerText1}</div>
                                        <div class="text-[10px] text-slate-500">${appState.settings.headerText2}</div>
                                    </div>
                                </div>
                                <table class="w-full space-y-1 mb-3">
                                    <tr><td class="font-semibold w-24">Nama</td><td>: ${s.nama}</td></tr>
                                    <tr><td class="font-semibold">Tempat/Tgl Lahir</td><td>: ${s.tempatLahir}, ${s.tanggalLahir}</td></tr>
                                    <tr><td class="font-semibold">Kelas</td><td>: ${s.kelas}</td></tr>
                                    <tr><td class="font-semibold text-blue-700">Username</td><td>: <span class="font-mono font-bold">${s.username}</span></td></tr>
                                    <tr><td class="font-semibold text-emerald-700">Password</td><td>: <span class="font-mono font-bold">${s.password}</span></td></tr>
                                </table>
                            </div>
                            <div class="border-t pt-2 flex justify-between items-end">
                                <div class="text-[10px] text-slate-500">T.A: ${appState.settings.tahunAjaran} | Sem: ${appState.settings.semester}</div>
                                <div class="text-center">
                                    <div class="text-[10px]">Kepala Sekolah</div>
                                    <img src="${appState.settings.ttdUrl}" class="h-8 mx-auto my-1">
                                    <div class="font-bold underline text-[10px]">${appState.settings.namaKepsek}</div>
                                </div>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`;
            } else if (adminTab === 'hasil') {
                return `
                <div class="bg-white rounded-xl shadow p-6">
                    <h3 class="font-bold text-slate-800 mb-4">Rekapitulasi Hasil Jawaban Siswa</h3>
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b text-xs uppercase text-slate-600">
                            <tr><th class="p-3">Nama Siswa</th><th class="p-3">Kelas</th><th class="p-3">Mata Pelajaran</th><th class="p-3">Nilai</th><th class="p-3">Waktu Submit</th></tr>
                        </thead>
                        <tbody class="divide-y">
                            ${appState.results.map(r => `
                            <tr>
                                <td class="p-3 font-semibold">${r.nama}</td>
                                <td class="p-3">${r.kelas}</td>
                                <td class="p-3">${r.mapel}</td>
                                <td class="p-3 font-bold text-blue-600">${r.nilai}</td>
                                <td class="p-3 text-xs text-slate-500">${r.waktu}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;
            } else if (adminTab === 'pengaturan') {
                return `
                <div class="bg-white rounded-xl shadow p-6 max-w-2xl space-y-4">
                    <h3 class="font-bold text-slate-800">Pengaturan Umum Aplikasi</h3>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">Teks Header 1 (Cth: PUSPENDIK)</label>
                            <input type="text" id="setH1" value="${appState.settings.headerText1}" class="w-full border px-3 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">Teks Header 2 (Cth: CBT Application)</label>
                            <input type="text" id="setH2" value="${appState.settings.headerText2}" class="w-full border px-3 py-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 mb-1">Kop Lembaga (Untuk Kartu Ujian)</label>
                            <textarea id="setKop" rows="3" class="w-full border px-3 py-2 rounded-lg">${appState.settings.kopLembaga}</textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block font-semibold text-slate-600 mb-1">Tahun Ajaran</label>
                                <input type="text" id="setTA" value="${appState.settings.tahunAjaran}" class="w-full border px-3 py-2 rounded-lg">
                            </div>
                            <div>
                                <label class="block font-semibold text-slate-600 mb-1">Semester</label>
                                <select id="setSem" class="w-full border px-3 py-2 rounded-lg">
                                    <option value="Ganjil" ${appState.settings.semester==='Ganjil'?'selected':''}>Ganjil</option>
                                    <option value="Genap" ${appState.settings.semester==='Genap'?'selected':''}>Genap</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-lg shadow">Simpan Pengaturan</button>
                    </div>
                </div>`;
            }
        }

        function saveSettings() {
            appState.settings.headerText1 = document.getElementById('setH1').value;
            appState.settings.headerText2 = document.getElementById('setH2').value;
            appState.settings.kopLembaga = document.getElementById('setKop').value;
            appState.settings.tahunAjaran = document.getElementById('setTA').value;
            appState.settings.semester = document.getElementById('setSem').value;
            alertModal("Pengaturan berhasil disimpan!");
            render();
        }

        function tarikDataNaikKelas() {
            alertModal("Fitur Tarik Data & Naik Kelas berhasil dijalankan! Siswa kelas 7 naik ke 8, 8 naik ke 9, dan data baru ditarik.");
        }

        function toggleTokenStatus(el) {
            appState.settings.tokenStatus = el.checked;
        }

        function addClass() {
            const val = document.getElementById('newKelasName').value.trim().toUpperCase();
            if(val && !appState.classes.includes(val)) {
                appState.classes.push(val);
                render();
            }
        }

        function openAddStudentModal() {
            const nama = prompt("Masukkan Nama Lengkap Siswa:");
            if(!nama) return;
            const kelas = prompt("Masukkan Kelas (Cth: 9A):", "9A");
            const user = nama.replace(/\s+/g, '').toUpperCase();
            const pass = Math.random().toString(36).substring(2, 8);
            appState.students.push({ id: Date.now(), username: user, password: pass, nama: nama, tempatLahir: "Surakarta", tanggalLahir: "2010-01-01", kelas: kelas });
            render();
        }

        function deleteStudent(id) {
            appState.students = appState.students.filter(s => s.id !== id);
            render();
        }

        function editStudent(id) {
            const s = appState.students.find(x => x.id === id);
            const baru = prompt("Ubah Nama Siswa:", s.nama);
            if(baru) s.nama = baru;
            render();
        }

        function alertModal(msg) {
            alert(msg);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
